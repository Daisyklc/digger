<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body { width: 280px; font-family: system-ui, sans-serif; margin: 0; padding: 14px; }
      h1 { font-size: 15px; margin: 0 0 10px; }
      label { display: block; font-size: 12px; color: #555; margin: 10px 0 4px; }
      select, input { width: 100%; box-sizing: border-box; padding: 6px; font-size: 13px; }
      button { width: 100%; margin-top: 14px; padding: 9px; font-size: 14px;
               background: #2d7ff9; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
      .status { margin-top: 10px; font-size: 12px; color: #888; }
    </style>
  </head>
  <body>
    <h1>WebTranslator</h1>

    <label for="mode">翻译模式</label>
    <select id="mode">
      <option value="auto">自动识别</option>
      <option value="ebook">电子书 / 文本</option>
      <option value="comic">漫画 / 图片</option>
      <option value="novel">小说 (Kindle 日文)</option>
    </select>

    <label for="targetLang">目标语言</label>
    <select id="targetLang">
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁体中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>

    <label for="series">作品名 (术语一致, 可选)</label>
    <input id="series" type="text" placeholder="例如 some-novel" />

    <!-- 小说专项: mode=novel 时显示 -->
    <div id="novelOpts" style="display:none">
      <label for="reading">阅读模式</label>
      <select id="reading">
        <option value="realtime">手动翻页 · 实时翻译</option>
        <option value="auto">自动翻页 · 保存翻译</option>
      </select>

      <label for="book">书籍 ID (用于保存/导出/续传)</label>
      <input id="book" type="text" placeholder="例如 book-001" />

      <label><input type="checkbox" id="polish" checked /> 通顺润色 (二阶段)</label>

      <label for="direction">翻页方向</label>
      <select id="direction">
        <option value="rtl">右→左 (竖排日文)</option>
        <option value="ltr">左→右 (横排)</option>
      </select>

      <label for="interval">自动翻页间隔 (毫秒)</label>
      <input id="interval" type="number" value="1500" min="500" step="100" />
    </div>

    <label for="backend">后端地址</label>
    <input id="backend" type="text" placeholder="http://127.0.0.1:8000" />

    <button id="run">翻译本页</button>
    <button id="stop" style="display:none; background:#d9534f">停止</button>
    <button id="export" style="display:none; background:#5cb85c">导出整本 (markdown)</button>
    <div class="status" id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
