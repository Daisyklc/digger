<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebTranslator · 本地仪表盘</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <h1>WebTranslator</h1>
      <span class="sub">本地仪表盘 · 受控浏览器 + 翻译内核</span>
      <span id="health" class="pill">检查中…</span>
    </header>

    <main>
      <section class="card">
        <h2>1 · 受控浏览器</h2>
        <p class="hint">点「启动浏览器」会打开一个真实浏览器窗口，在那里手动登录目标站并翻到要读的页。</p>
        <div class="row">
          <input id="url" type="text" placeholder="可选: 起始网址，如 https://read.amazon.co.jp" />
          <button id="launch">启动浏览器</button>
          <button id="goto" class="ghost">前往</button>
        </div>
        <div id="browserStatus" class="status-line">浏览器未启动</div>
      </section>

      <section class="card">
        <h2>2 · 配置</h2>
        <div class="grid">
          <label>书籍 ID<input id="book" type="text" value="book-001" /></label>
          <label>目标语言
            <select id="targetLang">
              <option value="zh-CN">简体中文</option>
              <option value="zh-TW">繁体中文</option>
              <option value="en">English</option>
            </select>
          </label>
          <label>源语言
            <select id="sourceLang">
              <option value="ja">日本語</option>
              <option value="auto">自动</option>
              <option value="en">English</option>
            </select>
          </label>
          <label>翻页方向
            <select id="direction">
              <option value="rtl">右→左 (竖排日文)</option>
              <option value="ltr">左→右 (横排)</option>
            </select>
          </label>
          <label>自动翻页间隔(秒)<input id="interval" type="number" value="1.5" step="0.5" min="0.5" /></label>
          <label class="check"><input id="polish" type="checkbox" checked /> 通顺润色(二阶段)</label>
        </div>
      </section>

      <section class="card">
        <h2>3 · 采集 / 翻译 (已分离)</h2>
        <p class="hint">采集只追加不覆盖。若该书已有截图, 续采前请先在受控浏览器里手动翻到衔接页, 再点「开始采集」。</p>
        <div class="row">
          <button id="translateOne">翻译当前页</button>
          <button id="startCapture" class="primary">开始采集</button>
          <button id="startProcess">处理队列</button>
          <button id="stop" class="danger" disabled>停止</button>
          <button id="export" class="ghost">导出整本(txt 原文+译文)</button>
        </div>
        <div class="progress">
          <div id="progressMsg">就绪</div>
          <div class="bar"><div id="progressFill"></div></div>
          <div id="progressNum">已翻 0 页</div>
        </div>
      </section>

      <section class="card panel">
        <h2>对照面板 <span class="hint">(最近一页)</span></h2>
        <div class="compare">
          <div class="col"><div class="col-h">原文</div><div id="orig" class="col-body"></div></div>
          <div class="col"><div class="col-h">译文</div><div id="trans" class="col-body"></div></div>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
